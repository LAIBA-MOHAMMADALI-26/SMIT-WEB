<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  /* defines how many columns should be there in the layout  */
  grid-template-columns: auto auto auto; 
    grid-template-rows: 100px 300px;
  background-color: dodgerblue;
  padding: 10px;
}
.container div {
  background-color: #f1f1f1;
  border: 1px solid black;
  padding: 10px;
  font-size: 30px;
  text-align: center;
}
.item1 {
  /* grid-column: 1 / span 3; */
   /* grid-column-end: span 3;  column will span from 1 to 3  */
    /* grid-column-start: 2; item will start from column 2 */
  

}
.item1 {justify-self: right;}
.item6 {justify-self: center;}
.item1 {
  grid-row: 1 / span 2;
  grid-row:1/3;
}
</style>
</head>
<body>

<h1>Grid Layout</h1>

<p>A Grid Layout must have a parent element with the <em>display</em> property set to <em>grid</em> or <em>inline-grid</em>.</p>

<p>Direct child element(s) of the grid container automatically becomes grid items.</p>

<div class="container">
  <div  class="item1">1</div>
  <div>2</div>
  <div>3</div>  
  <div>4</div>
  <div>5</div>
  <div>6</div>
  <div>7</div>
  <div>8</div>
</div>

</body>
</html>
